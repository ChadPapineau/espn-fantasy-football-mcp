# ci — the product gate on every push (any branch) and every PR. Spec: plan 04 §4.1 (jobs lint,
# typecheck, test, supply-chain, pack, process, smoke), plan 05 §7 (coverage gate), plan 05 §4.2 +
# plan 10 A15a (process and end-to-end suites: ubuntu on every push, macOS weekly / on demand), plan
# 10 A3a + B10 (the Inspector smoke in fixture mode, core and full), plan 04 R5 (ubuntu, Node from .nvmrc), R11 (full
# runtime tree). Ported from sibling @d72e03b, adapted.
#
# Choices, and why
# - Actions pinned to full commit SHAs with the `# vX.Y.Z` comment; Dependabot (github-actions)
#   rewrites both together.
# - Node from .nvmrc (24.21.0, matching engines ">=24.15"; .npmrc engine-strict makes a mismatch
#   fail). No dependency cache (package-manager-cache: false): one less thing that can be poisoned,
#   and `npm ci` of the committed lockfile with ignore-scripts=true (.npmrc) is fast enough.
# - Safe on a public repo: permissions contents: read; NO secrets of any kind (CI never holds ESPN
#   credentials — plan 04 §4); `pull_request` (never pull_request_target); persist-credentials:
#   false so the job token never lands in .git/config.
# - Concurrency cancels superseded runs for PRs and for pushes to any branch but main; a run on main
#   is never cancelled — a cancelled run on main is a commit without a verdict.
# - lint's commit identity step (CLAUDE.md "Security": commit metadata is published): the local
#   guards (.githooks/pre-commit, commit-paths.sh → scan-secrets --identity) are skipped by a clone
#   without core.hooksPath, `git merge` (pre-merge-commit), a cherry-pick or a GitHub web merge
#   (the account's commit email), so CI refuses — before npm ci, so its verdict never waits on
#   ESLint — every commit after IDENTITY_BASELINE (the newest commit made before the no-reply rule;
#   it and its ancestors are the accepted history residual, HANDOFF 2026-10-05) whose author or
#   committer is not a GitHub no-reply address, and every annotated tag whose tagger is not. The
#   whole post-baseline history on every event, never only the pushed range: a new branch, a
#   force-push or a manual run has no usable range. The rule is scan-secrets.mjs's isGithubNoreply,
#   imported, plus a GitHub App's `<id>+<slug>[bot]` form (Dependabot's PR commits); GitHub's own
#   `noreply@github.com` is accepted as committer or tagger only (web merges, signed bot commits).
#   It prints the commit or tag and the role, never an address.
# - smoke: the MCP Inspector CLI is pinned EXACTLY (npx pins are not Dependabot-managed — bump
#   deliberately) and runs from $RUNNER_TEMP with npm_config_ignore_scripts=true, so neither the
#   project .npmrc nor an install script of the Inspector's own tree is involved. It drives the built
#   server through tests/smoke/fixture-serve.mjs (fixture mode on fx-10h over a temp home — a stdio
#   client passes only a safe subset of its environment to the server). `npm run smoke` is the same
#   A3a check with the repo's own SDK client, both protocol eras, instructions and cache hints.
# - pack rehearses release.yml's tarball on every push (plan 04 §4.4; Stage C finding
#   ci-release-workflow-missing): the committed lockfile copied to npm-shrinkwrap.json, the scan's
#   --release checks, npm pack, and scripts/ci/check-release-install.mjs — the README's release
#   install (`npm ci --omit=dev --ignore-scripts`, then `npm link --ignore-scripts`) run offline on
#   the packed tarball — so the first tag is never the first run of those steps.
# - process-macos (weekly + on demand, never on push): the process and end-to-end suites on macOS,
#   and the keychain round trip (EFF_KEYCHAIN_PROCESS_TEST=1: `eff setup --service-name
#   eff-test-<random>` through the real launchd self-test, the eff-test items removed afterwards —
#   never the real service name; plan 04 §4.4, plan 05 §4.2).

name: ci

on:
  push:
  pull_request:
  # release.yml calls this gate on a tag before it packs (plan 04 §4.4: "full ci.yml jobs")
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1" # Monday 06:23 UTC: the weekly macOS process run (plan 10 A15a)

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name in a called run ("release"): a tag's own ci run and the one
  # release.yml calls never share a group, so neither cancels the other
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (history for the commit identity and commit-message checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Commit identity — authors and committers after the baseline, and taggers, are GitHub no-reply addresses (CLAUDE.md)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The newest commit made before the no-reply rule (docs/HANDOFF.md "Decisions made",
          # 2026-10-05): it and its ancestors carry a machine-derived address — the accepted history
          # residual. Everything after it is checked on every event.
          IDENTITY_BASELINE: f9eebbf0b9d1f2cfe3bbc4aa673bc82adff86c62
        run: |
          set -euo pipefail
          if ! git cat-file -e "${IDENTITY_BASELINE}^{commit}" 2>/dev/null; then
            echo "::error::the identity baseline ${IDENTITY_BASELINE} is not in this checkout — the commit identities cannot be verified"
            exit 1
          fi
          RANGE="${IDENTITY_BASELINE}..${HEAD_SHA}" node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          // the rule commit-paths.sh and the pre-commit hook apply locally (scan-secrets --identity)
          const scanner = path.join(process.env.GITHUB_WORKSPACE, "scripts/dev/scan-secrets.mjs");
          const { isGithubNoreply } = await import(pathToFileURL(scanner).href);
          // a GitHub App's no-reply address: Dependabot authors its PR commits with one
          const BOT = /^\d+\+[a-z0-9](?:[a-z0-9-]{0,38})\[bot\]@users\.noreply\.github\.com$/i;
          const noreply = (a) => isGithubNoreply(a) || BOT.test(a);
          // GitHub's own committer (web merges, Dependabot's signed commits) names no person:
          // accepted as a committer or tagger, never as an author
          const WEB_FLOW = "noreply@github.com";
          const range = process.env.RANGE;
          const git = (args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 256 * 1024 * 1024 });
          let refused = 0;
          // the object and the role only: an address is never printed
          const refuse = (what, role) => {
            refused++;
            console.log(`::error::${what}: the ${role} address is not a GitHub no-reply address (address not printed)`);
          };
          // the raw addresses as published (%ae, %ce): never the .mailmap-rewritten capital-E forms,
          // and no signature output (a log.showSignature setting) mixed into the records
          const f = git(["log", "--no-use-mailmap", "--no-show-signature", "-z", "--format=%H%x00%ae%x00%ce", range]).split("\0");
          if (f.at(-1) === "") f.pop();
          if (f.length % 3 !== 0) {
            console.log("::error::unexpected git log output — the commit identities cannot be verified");
            process.exit(1);
          }
          for (let i = 0; i < f.length; i += 3) {
            const [sha, author, committer] = f.slice(i, i + 3);
            if (!noreply(author)) refuse(`commit ${sha}`, "author");
            if (!noreply(committer) && committer.toLowerCase() !== WEB_FLOW) refuse(`commit ${sha}`, "committer");
          }
          // an annotated tag publishes its tagger too (a release tag, plan 04 §4.4); a lightweight one names no one
          let tags = 0;
          for (const line of git(["for-each-ref", "--format=%(objecttype)%00%(refname)%00%(taggeremail:trim)", "refs/tags"]).split("\n")) {
            const [type, ref, tagger = ""] = line.split("\0");
            if (type !== "tag") continue;
            tags++;
            if (!noreply(tagger) && tagger.toLowerCase() !== WEB_FLOW) refuse(`tag ${ref}`, "tagger");
          }
          console.log(`checked the author and committer of ${f.length / 3} commit(s) in ${range} and the tagger of ${tags} annotated tag(s)`);
          if (refused) process.exit(1);
          JS
      - name: No source path is git-ignored (S6 — an over-broad pattern drops a file silently)
        run: |
          set -euo pipefail
          ignored="$(git ls-files --others --ignored --exclude-standard -- src tests scripts skills)"
          probes="src/lib/x.ts src/build/x.ts src/out/x.ts src/cli/logs/x.ts tests/private/x.ts tests/build/x.test.ts src/auth/cookie.ts src/auth/secrets.ts src/auth/credentials.ts src/auth/espn_s2.ts src/providers/espn/swid.ts tests/auth/swid.test.ts"
          # shellcheck disable=SC2086
          hit="$(git check-ignore --no-index $probes || true)"
          if [ -n "$ignored" ] || [ -n "$hit" ]; then
            echo "git-ignored source paths:"; printf '%s\n' "$ignored" "$hit"; exit 1
          fi
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: ESLint (type-checked, import boundaries, ESPN zones)
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Commit messages — Conventional, no AI attribution trailer (plan 04 R4)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${HEAD_SHA}"
          fi
          if [ -z "$range" ]; then
            echo "no usable range (new branch, manual run or force-push) — commit messages not checked"
            exit 0
          fi
          msg="$RUNNER_TEMP/commit-msg.txt"
          n=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$msg"
            node scripts/dev/check-commit-msg.mjs "$msg" || { echo "::error::commit $sha: message refused"; exit 1; }
            n=$((n + 1))
          done
          echo "checked $n commit message(s) in $range"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: tsc --noEmit (src + tests + scripts)
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Tests with coverage (vitest thresholds, plan 05 §7)
        run: npm run test:coverage
      - name: Coverage gate, independent re-check (per-file 100 % modules)
        run: npm run check:coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: npm audit — runtime tree, high/critical fails
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — full tree, report only
        run: npm audit || echo "::notice::npm audit (full tree incl. dev) reported advisories — report only"
      - name: No install scripts or native builds; the keyring platform package is a bare prebuilt .node
        run: npm run check:no-scripts
      - name: Runtime licenses on the allow-list
        run: npm run check:licenses
      - name: Runtime tree equals scripts/ci/runtime-allowlist.json (every depth)
        run: npm run check:runtime-tree

  pack:
    name: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Scan what npm pack would ship (files allow-list, plugin root, secrets, identifiers)
        run: npm run pack:scan
      - name: Rehearse release.yml's tarball — the lockfile packed as npm-shrinkwrap.json, installed the README's way, offline
        run: |
          set -euo pipefail
          cp package-lock.json npm-shrinkwrap.json
          npm run pack:scan -- --release
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          version="$(node -p 'require("./package.json").version')"
          node scripts/ci/check-release-install.mjs --tarball "$RUNNER_TEMP/espn-fantasy-football-mcp-$version.tgz"

  process:
    name: process
    runs-on: ubuntu-24.04
    # the full-toolset stdio suites (34 tools on seven seeded servers, the Skills' full sequences)
    # add ~5 min to the ~6 min of the core ones (plan 10 B8, B10, B11)
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Process, end-to-end and latency suites against dist (plan 05 §4.2; A3a, A4a, A8a, A14a-A16a)
        env:
          EFF_PROCESS_TEST_DIST: "1"
        run: npm run test:process

  process-macos:
    name: process (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Process, end-to-end and latency suites against dist + the keychain round trip (A15a on macOS)
        env:
          EFF_PROCESS_TEST_DIST: "1"
          EFF_KEYCHAIN_PROCESS_TEST: "1"
        run: npm run test:process

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INSPECTOR: "@modelcontextprotocol/inspector@2.8.0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Build
        run: npm run build
      - name: SDK stdio smoke — both protocol eras × core and full (tools, instructions, resources, prompts, G1, G2, G3)
        run: npm run smoke
      - name: MCP Inspector CLI (pinned) — tools/list, resources, templates, prompts in fixture mode, core and full (plan 10 A3a, B10)
        env:
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for toolset in core full; do
            out="$RUNNER_TEMP/inspector-$toolset"
            mkdir -p "$out"
            for method in tools/list resources/list resources/templates/list prompts/list; do
              file="$out/$(echo "$method" | tr / _).json"
              timeout 180 npx --yes "$INSPECTOR" --cli \
                node "$GITHUB_WORKSPACE/tests/smoke/fixture-serve.mjs" "$toolset" \
                --method "$method" --format json > "$file"
              echo "$toolset $method: $(wc -c < "$file") bytes"
            done
            node "$GITHUB_WORKSPACE/tests/smoke/assert-inspector.mjs" --toolset "$toolset" \
              "$out/tools_list.json" "$out/resources_list.json" \
              "$out/resources_templates_list.json" "$out/prompts_list.json"
          done
