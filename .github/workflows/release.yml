# release — on a tag vX.Y.Z (plan 04 §4.4, R8; Stage C finding ci-release-workflow-missing): the
# full ci.yml gate first (called as a reusable workflow, never copied: the same jobs on the same
# commit), then the changelog check (scripts/ci/check-changelog.mjs: the tag, package.json's
# version and a dated CHANGELOG.md section agree; the section is the release body), the lock (the
# committed package-lock.json copied, byte for byte, to npm-shrinkwrap.json — npm pack never ships
# package-lock.json, and package.json `files` names the shrinkwrap), the tarball scan
# (scan-tarball.mjs --release: the files allow-list, the plugin root, secrets and identifiers, and
# the packed shrinkwrap is the committed lockfile), npm pack with its sha256, the README's release
# install run on that very tarball (check-release-install.mjs: unpack, `npm ci --omit=dev
# --ignore-scripts` offline — exactly the lockfile's runtime tree, every integrity hash checked —
# then `npm link --ignore-scripts` under a throwaway prefix, and the linked `eff` runs; npm never
# reads the shrinkwrap of a .tgz it installs by path, so `npm install -g <tarball>` is not the
# documented install), and a GitHub Release carrying the tarball and its sha256. ci.yml's pack job
# rehearses the same lock, scan, pack and install on every push.
#
# Choices, and why
# - No npm publish from CI (R8): publishing, if ever, is the owner's manual `npm publish
#   --provenance`.
# - permissions: contents: read by default; the release job alone gets contents: write — the one
#   scope `gh release create` needs, with the job's own token (no repository secret of any kind).
# - Actions pinned to full commit SHAs with the `# vX.Y.Z` comment; persist-credentials: false;
#   `npm ci` of the committed lockfile with ignore-scripts=true (.npmrc).
# - A tag releases only once the ci gate is green on it (needs: ci); a re-pushed tag cancels the
#   superseded run (a tag is never refs/heads/main).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci
      - name: Build
        run: npm run build
      - name: The tag, package.json and CHANGELOG.md agree (the release notes)
        run: node scripts/ci/check-changelog.mjs --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: The tarball's lock is the committed lockfile, byte for byte (npm-shrinkwrap.json)
        run: cp package-lock.json npm-shrinkwrap.json
      - name: Scan what npm pack ships (files allow-list, plugin root, secrets, identifiers; the lock packed)
        run: npm run pack:scan -- --release
      - name: Pack and checksum
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          tgz="espn-fantasy-football-mcp-${GITHUB_REF_NAME#v}.tgz"
          test -f "$tgz"
          sha256sum "$tgz" > "$tgz.sha256"
      - name: Install that tarball the README's way, offline — the lockfile's runtime tree, then the linked eff runs
        run: node scripts/ci/check-release-install.mjs --tarball "$RUNNER_TEMP/espn-fantasy-football-mcp-${GITHUB_REF_NAME#v}.tgz"
      - name: Create the GitHub Release (nothing goes to the npm registry — R8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/espn-fantasy-football-mcp-${GITHUB_REF_NAME#v}.tgz"
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$tgz" "$tgz.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
