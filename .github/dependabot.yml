# Dependabot — plan 04 §5 (version updates monthly, grouped), plan 06 §1.1. Ported from sibling
# @d72e03b, adapted (monthly).
# github-actions: keeps the SHA-pinned actions in .github/workflows current (it rewrites the pin and
#   the `# vX.Y.Z` comment together), grouped into one PR.
# npm: minor + patch updates grouped, majors one PR each (a major is a decision, not a chore);
#   `increase` keeps the exact pins plan 04 §2 mandates. A runtime change still needs a plan 04 §2
#   row and a reviewed scripts/ci/runtime-allowlist.json update — CI fails until both exist.
# Not managed here (bump by hand, value and checksum together): the mermaid-cli / puppeteer / Claude
#   Code npx pins in .github/workflows/docs.yml and the gitleaks pin in scripts/ci/install-gitleaks.sh.
# Where it takes effect (Stage C finding ci-default-branch-controls-inert): GitHub reads this file
#   only from the DEFAULT branch, and builds the dependency graph — which Dependabot's alerts and
#   security updates read — only from the default branch's manifests. While the default branch
#   carries neither this file nor package-lock.json, no update PR is opened and no alert covers the
#   runtime tree, whatever the build branch holds; no workflow can stand in for that (only the push
#   gate's npm audit runs). It starts when the default branch carries both: the merge to main, or
#   the owner setting the default branch to the build branch. The weekly macOS run does not wait for
#   it (ci.yml's macos-due).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    # Majors declined on review (2026-11-04, Dependabot PRs 4 and 5; docs/plan/changelog.md
    # "Reviews", the two "Declined" rows of that date). Minor and patch updates of both still come
    # in the group below.
    ignore:
      # @types/node follows the RUNTIME's major (engines ">=24.15", .nvmrc on Node 24), not the
      # newest Node: the 26.x types let tsc accept calls Node 24 lacks (v8.startHeapProfile(),
      # diagnostics_channel.boundedChannel(), process.addUncaughtExceptionCaptureCallback() are
      # undefined on 24.21.0). Re-check when .nvmrc and engines move to the next even line: raise
      # the types major with them (tests/lint/dependency-review.test.ts holds the two majors equal).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript 7 (the native compiler) is outside typescript-eslint's supported range (8.72.1
      # peers typescript ">=4.8.4 <6.1.0" and refuses 7.0 when it loads), so the lint gate cannot
      # run on it. Only the declined major is ignored: a later one is proposed and evaluated again.
      # Re-check when a typescript-eslint release lists 7.x in its peerDependencies: then drop this
      # rule and evaluate 7.x again (tsc, lint, build, the suites, tsx and vitest).
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      prefix-development: "build"
