# secrets (file secret-scan.yml: the repo .gitignore ignores `secrets.*`) — gitleaks with the ESPN
# rules (.gitleaks.toml) plus the local scanner over every tracked file. Spec: plan 04 R6, §4.1
# (`secrets`: full history), §4.3 (rules); plan 10 §3.0 Z1. Ported from sibling @d72e03b, adapted.
#
# Jobs
#   secrets           push / PR / manual / weekly: gitleaks over the FULL git history (every ref the
#                     checkout has), then the checked-out tree, then scan-secrets.mjs --all.
#   secrets-selftest  push / PR / manual: proves the rules can fire. scripts/ci/secret-fixtures.mjs
#                     GENERATES a must-flag file (every custom rule must report) and a must-pass file
#                     (the documentation placeholders must not) in $RUNNER_TEMP — no fake secret is
#                     ever committed, so .gitleaks.toml needs no path allowlist.
#
# Why the gitleaks binary and not gitleaks/gitleaks-action
#   The action needs GITHUB_TOKEN (and a license for org accounts), cannot scan a single directory,
#   and downloads an unverified binary at run time anyway. scripts/ci/install-gitleaks.sh fetches an
#   exact release AND checks its sha256 (a content pin, stronger than an action's commit SHA), with
#   no token. Gitleaks is free; no license secret exists or is needed.
#
# Safe on a public repo: permissions contents: read; no secrets; `pull_request` (never
# pull_request_target); persist-credentials: false; fetch-depth: 0 only because the history scan
# needs the commits. Values are redacted from every log line (--redact).

name: secrets

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install gitleaks (pinned version + sha256)
        run: bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: gitleaks — the full history (plan 04 §4.1)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .
      - name: gitleaks — the checked-out tree
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .
      - name: scan-secrets — every tracked file (ESPN rules, IPv4, home paths, emails)
        run: node scripts/dev/scan-secrets.mjs --all

  secrets-selftest:
    name: secrets-selftest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install gitleaks (pinned version + sha256)
        run: bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Generate the fixtures outside the repo
        run: node scripts/ci/secret-fixtures.mjs write "$RUNNER_TEMP/selftest"
      - name: Every custom rule must fire on must-flag.txt (Z1)
        run: |
          set -euo pipefail
          set +e
          gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 99 \
            --report-format json --report-path "$RUNNER_TEMP/must-flag.json" "$RUNNER_TEMP/selftest/must-flag.txt"
          rc=$?
          set -e
          echo "self-test: gitleaks exit code on must-flag = $rc (99 = leaks found, as required)"
          if [ "$rc" -ne 99 ]; then
            echo "::error::self-test: expected exit 99 (leaks) on must-flag, got $rc — a rule matched nothing or the config failed to load"
            exit 1
          fi
          node scripts/ci/secret-fixtures.mjs assert-gitleaks "$RUNNER_TEMP/must-flag.json" --expect-all
      - name: The documentation placeholders must NOT fire (must-pass.txt)
        run: |
          set -euo pipefail
          set +e
          gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 99 \
            --report-format json --report-path "$RUNNER_TEMP/must-pass.json" "$RUNNER_TEMP/selftest/must-pass.txt"
          rc=$?
          set -e
          echo "self-test: gitleaks exit code on must-pass = $rc (0 = clean, as required)"
          node scripts/ci/secret-fixtures.mjs assert-gitleaks "$RUNNER_TEMP/must-pass.json" --expect-none
          [ "$rc" -eq 0 ]
      - name: scan-secrets agrees (every must-flag case, no must-pass finding)
        run: node scripts/ci/secret-fixtures.mjs assert-scan
